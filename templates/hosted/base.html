<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProjectPOS Hosted{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; color:#1f2937; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:20px; margin-bottom:16px; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .btn, button { background:#2563eb; color:#fff; border:none; padding:10px 14px; border-radius:8px; text-decoration:none; cursor:pointer; display:inline-block; }
    .btn.secondary { background:#6b7280; }
    input, select, textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; }
    label { display:block; margin:10px 0 6px; font-weight:600; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .msg { padding:10px 12px; border-radius:8px; margin-bottom:10px; }
    .msg.error { background:#fee2e2; color:#991b1b; }
    .msg.success { background:#dcfce7; color:#166534; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #e5e7eb; font-size:14px; }
    .muted { color:#6b7280; font-size:14px; }
    code { background:#f3f4f6; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div><strong>ProjectPOS Hosted</strong> <span class="muted">Sync & Account Server</span></div>
      <div>
        {% if request.user.is_authenticated %}
          <span class="muted">{{ request.user.username }}</span>
          <a class="btn secondary" href="{% url 'hosted-dashboard' %}">Dashboard</a>
          <a class="btn secondary" href="{% url 'hosted-logout' %}">Logout</a>
        {% else %}
          <a class="btn secondary" href="{% url 'hosted-login' %}">Login</a>
          <a class="btn" href="{% url 'hosted-signup' %}">Signup</a>
        {% endif %}
      </div>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
