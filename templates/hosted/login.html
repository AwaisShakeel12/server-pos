{% extends 'hosted/base.html' %}
{% block title %}Login - ProjectPOS Hosted{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
  <h2>Login</h2>
  <p class="muted">Sign in to access your hosted store, sync access, and user permissions.</p>
  <form method="post">
    {% csrf_token %}
    <label for="username">Username</label>
    <input id="username" name="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <div style="margin-top:16px;">
      <button type="submit">Login</button>
      <a class="btn secondary" href="{% url 'hosted-signup' %}">Create account</a>
    </div>
  </form>
</div>
{% endblock %}
